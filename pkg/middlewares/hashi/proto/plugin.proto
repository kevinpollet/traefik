syntax = "proto3";
package proto;
option go_package = "./proto";

message Empty{}

message HeaderValues {
    repeated string values = 2;
}

message Request {
    string method = 1;
    string path = 2;
    map<string, HeaderValues> headers = 3;
}

message Response {
    map<string, string> set_headers = 1;
}

service MiddlewarePlugin {
    rpc HandleRequest(Request) returns (Response);
}
