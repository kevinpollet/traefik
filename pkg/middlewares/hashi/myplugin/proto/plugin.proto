syntax = "proto3";
package proto;
option go_package = "./proto";

message Empty {}

message HeaderValues {
    repeated string value = 1;
}

message Request {
    map<string, HeaderValues> headers = 1;
}

message Response {
    map<string, string> set_headers = 1;
}

service Middleware {
    rpc Process(Request) returns (Response);
}